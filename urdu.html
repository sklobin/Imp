function wrapText(text, maxWidth) {
  let words = text.split(' ');
  let lines = [];
  let line = '';

  for(let n = 0; n < words.length; n++) {
    let testLine = line + words[n] + ' ';
    let metrics = ctx.measureText(testLine);
    if(metrics.width > maxWidth && n > 0) {
      lines.push(line);
      line = words[n] + ' ';
    } else {
      line = testLine;
    }
  }
  lines.push(line);
  return lines;
}

function generate(){
  let quote = document.getElementById('quote').value.trim();
  if(!quote){ alert('Pehle quote likhein!'); return; }

  // Random background
  let img = new Image();
  img.crossOrigin = "anonymous";
  img.src = bgImages[Math.floor(Math.random() * bgImages.length)];

  img.onload = function(){
    ctx.clearRect(0, 0, 1080, 1920);
    ctx.drawImage(img, 0, 0, 1080, 1920);

    // Dark overlay for text readability
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, 1080, 1920);

    // Quote text - NASTALIQ FIX HERE
    ctx.fillStyle = 'white';
    ctx.font = '700 70px "Noto Nastaliq Urdu"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Shadow add kiya taake har background pe clear rahe
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;

    let lines = wrapText(quote, 880);
    let lineHeight = 140; // YEH FIX HAI - 90 se 110 kar diya
    let startY = 1920/2 - (lines.length * lineHeight)/2;

    lines.forEach((line, i) => {
      ctx.fillText(line.trim(), 540, startY + i * lineHeight);
    });

    // SK WRITES watermark neeche
    ctx.shadowBlur = 0; // shadow hatado watermark se
    ctx.font = '500 45px "Noto Nastaliq Urdu"';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('SK WRITES', 540, 1850);
  }

  img.onerror = function(){
    alert('Background load nahi hui, dobara try karein');
  }
}

function download(){
  let link = document.createElement('a');
  link.download = 'SK_WRITES_' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png', 1.0);
  link.click();
}

window.onload = () => {
