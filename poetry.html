<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK WRITES  Poetry</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Nastaliq Urdu',serif;background:#0f172a;color:white;display:flex;flex-direction:column;align-items:center;padding:30px 20px;min-height:100vh}
h1{font-size:2rem;margin-bottom:20px;background:linear-gradient(90deg,#22c55e,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.box{background:#1e293b;padding:25px;border-radius:20px;width:100%;max-width:500px;border:1px solid #334155}
input{width:100%;padding:15px;font-family:'Noto Nastaliq Urdu',serif;font-size:1.3rem;background:#0f172a;border:2px solid #334155;border-radius:12px;color:white;margin-top:10px;outline:none}
input:focus{border-color:#22c55e}
.btn{width:100%;padding:14px;margin-top:15px;border:none;border-radius:12px;background:linear-gradient(90deg,#22c55e,#3b82f6);color:white;font-size:1.2rem;font-family:'Noto Nastaliq Urdu',serif;cursor:pointer;font-weight:600}
.btn:hover{opacity:0.9}
canvas{margin-top:25px;border-radius:20px;max-width:100%;box-shadow:0 20px 40px rgba(0,0,0,0.4)}
label{font-size:1.1rem;color:#94a3b8}
</style>
</head>
<body>

<h1>SK WRITES Poetry</h1>
<div class="box">
<label>Upar wali line:</label>
<input id="line1" placeholder="مثال: صبر کرنا سیکھ لو">
<label>Neeche wali line:</label>
<input id="line2" placeholder="مثال: کامیابی خود چل کر آئے گی">
<button class="btn" onclick="generate()">Image Banayen</button>
<button class="btn" onclick="download()" style="background:#f59e0b;">Download PNG</button>
</div>
<canvas id="canvas" width="1080" height="1920"></canvas>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

const bgImages=[
'https://picsum.photos/1080/1920?random=1',
'https://picsum.photos/1080/1920?random=2',
'https://picsum.photos/1080/1920?random=3',
'https://picsum.photos/1080/1920?random=4',
'https://picsum.photos/1080/1920?random=5',
'https://picsum.photos/1080/1920?random=6',
'https://picsum.photos/1080/1920?random=7',
'https://picsum.photos/1080/1920?random=8',
'https://picsum.photos/1080/1920?random=9',
'https://picsum.photos/1080/1920?random=10',
'https://picsum.photos/1080/1920?random=11',
'https://picsum.photos/1080/1920?random=12',
'https://picsum.photos/1080/1920?random=13',
'https://picsum.photos/1080/1920?random=14',
'https://picsum.photos/1080/1920?random=15',
'https://picsum.photos/1080/1920?random=16',
'https://picsum.photos/1080/1920?random=17',
'https://picsum.photos/1080/1920?random=18',
'https://picsum.photos/1080/1920?random=19',
'https://picsum.photos/1080/1920?random=20'
];

async function generate(){
let line1=document.getElementById('line1').value.trim();
let line2=document.getElementById('line2').value.trim();
if(!line1||!line2){alert('Dono lines likhein!');return;}

let img=new Image();
let randomIndex=Math.floor(Math.random()*bgImages.length);
img.src=bgImages[randomIndex];

img.onload=async function(){
try{
await img.decode();
ctx.clearRect(0,0,1080,1920);
ctx.drawImage(img,0,0,1080,1920);
drawText();
}catch(e){
drawGradient();
}
}

img.onerror=function(){
drawGradient();
}

function drawGradient(){
ctx.clearRect(0,0,1080,1920);
let gradient=ctx.createLinearGradient(0,0,0,1920);
gradient.addColorStop(0,'#1e3c72');
gradient.addColorStop(1,'#0f172a');
ctx.fillStyle=gradient;
ctx.fillRect(0,0,1080,1920);
drawText();
}

function drawText(){
ctx.fillStyle='rgba(0,0,0,0.6)';
ctx.fillRect(0,0,1080,1920);
ctx.fillStyle='white';
ctx.font='700 65px "Noto Nastaliq Urdu"';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.shadowColor='rgba(0,0,0,0.9)';
ctx.shadowBlur=15;
let y1=1920/2-120;
ctx.fillText(line1,540,y1);
ctx.shadowBlur=0;
ctx.strokeStyle='rgba(255,255,255,0.4)';
ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(340,1920/2);
ctx.lineTo(740,1920/2);
ctx.stroke();
let y2=1920/2+120;
ctx.shadowBlur=15;
ctx.fillText(line2,540,y2);
ctx.shadowBlur=0;
ctx.font='500 45px "Noto Nastaliq Urdu"';
ctx.fillStyle='rgba(255,255,255,0.85)';
ctx.fillText('SK WRITES',540,y2+80);
}
}

function download(){
let link=document.createElement('a');
link.download='SK_Mashwara_'+Date.now()+'.png';
link.href=canvas.toDataURL('image/png',1.0);
link.click();
}

window.onload=()=>{
document.getElementById('line1').value='زبان کو قابو میں رکھو';
document.getElementById('line2').value='کیونکہ یہ درندہ ہے';
generate();
}
</script>
</body>
</html>
