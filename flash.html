<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Flappy Bird Pro - With Sound</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(to bottom, #4ec0ca 0%, #3aa0a8 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

  .clouds {
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(ellipse 80px 40px at 20% 20%, rgba(255,255,255,0.3), transparent),
                radial-gradient(ellipse 100px 50px at 80% 30%, rgba(255,255,255,0.25), transparent);
            animation: cloudMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes cloudMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 0%; }
        }

  .container {
            width: 100%;
            height: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
        }

  .header {
            text-align: center;
            flex-shrink: 0;
        }

        h1 {
            font-size: clamp(16px, 4vw, 22px);
            color: white;
            text-shadow: 2px 2px 0px #2c3e50, 4px 4px 8px rgba(0,0,0,0.3);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

  .mode-badge {
            font-size: 7px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }

  .stats-bar {
            display: flex;
            justify-content: space-between;
            padding: 8px 16px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            flex-shrink: 0;
        }

  .stat {
            text-align: center;
            color: white;
        }

  .stat-label {
            font-size: 7px;
            opacity: 0.7;
            margin-bottom: 2px;
        }

  .stat-value {
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

  .sound-toggle {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

  .sound-toggle.muted {
            opacity: 0.5;
        }

  .game-wrapper {
            position: relative;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.2);
            flex: 1;
            display: flex;
            min-height: 0;
        }

        canvas {
            display: block;
            border-radius: 10px;
            background: linear-gradient(to bottom, #70c5ce 0%, #4ec0ca 70%, #3aa0a8 100%);
            width: 100%;
            height: 100%;
        }

  .start-screen,.game-over {
            position: absolute;
            inset: 6px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 16px;
        }

  .start-screen.hide,.game-over {
            display: none;
        }

  .game-over.show {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

  .start-title,.game-over-title {
            font-size: 18px;
            margin-bottom: 16px;
        }

  .start-title {
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

  .game-over-title {
            color: #e74c3c;
        }

  .start-text {
            font-size: 8px;
            line-height: 1.8;
            margin-bottom: 20px;
            opacity: 0.9;
        }

  .final-score {
            font-size: 28px;
            margin-bottom: 8px;
            color: #f39c12;
        }

  .best-badge {
            font-size: 8px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

  .btn {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 10px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 0 #d35400;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }

  .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #d35400;
        }

  .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-shrink: 0;
        }

  .btn-small {
            padding: 10px 16px;
            font-size: 8px;
            flex: 1;
        }

  .tap-hint {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            color: white;
            opacity: 0;
            animation: fadeInOut 2s ease-in-out infinite;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

  .tap-hint.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="clouds"></div>

    <div class="container">
        <div class="header">
            <h1>🐦 FLAPPY BIRD PRO</h1>
            <div class="mode-badge">SLOW MODE 🔊</div>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊</button>
            <div class="stat">
                <div class="stat-label">Best</div>
                <div class="stat-value" id="best">0</div>
            </div>
        </div>

        <div class="game-wrapper">
            <canvas id="game"></canvas>

            <div class="start-screen" id="startScreen">
                <div class="start-title">READY?</div>
                <div class="start-text">
                    TAP OR SPACE TO FLAP<br>
                    AVOID THE PIPES!<br><br>
                    SOUND: ON 🔊
                </div>
                <button class="btn" onclick="startGame()">START GAME</button>
            </div>

            <div class="game-over" id="gameOver">
                <div class="game-over-title">GAME OVER</div>
                <div class="final-score" id="finalScore">0</div>
                <div class="best-badge" id="newBest" style="display: none;">🏆 NEW BEST!</div>
                <button class="btn" onclick="startGame()">PLAY AGAIN</button>
            </div>

            <div class="tap-hint" id="tapHint">TAP TO FLAP</div>
        </div>

        <div class="controls">
            <button class="btn btn-small" onclick="startGame()">Restart</button>
            <button class="btn btn-small" onclick="togglePause()" id="pauseBtn">Pause</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const wrapper = document.querySelector('.game-wrapper');
            canvas.width = wrapper.clientWidth - 12;
            canvas.height = wrapper.clientHeight - 12;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // SOUND SYSTEM - Web Audio API
        let audioContext;
        let soundEnabled = true;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled ||!audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (type === 'flap') {
                // Flap sound - quick high beep
                oscillator.frequency.value = 400;
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'score') {
                // Score sound - happy chime
                oscillator.frequency.value = 800;
                gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.15);
            } else if (type === 'crash') {
                // Crash sound - low thud
                oscillator.frequency.value = 100;
                oscillator.type = 'sawtooth';
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            }
        }

        function toggleSound() {
            soundEnabled =!soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.textContent = soundEnabled? '🔊' : '🔇';
            btn.classList.toggle('muted',!soundEnabled);
        }

        // SLOW MODE SETTINGS
        const GRAVITY = 0.3;
        const FLAP_POWER = -4;
        const PIPE_SPEED = 2;
        const PIPE_GAP = 160;
        const PIPE_WIDTH = 60;

        let bird = {
            x: 80,
            y: canvas.height / 2,
            width: 34,
            height: 24,
            velocity: 0,
            rotation: 0
        };

        let pipes = [];
        let score = 0;
        let best = localStorage.getItem('flappy-best-slow') || 0;
        let gameRunning = false;
        let gamePaused = false;
        let frameCount = 0;
        let particles = [];

        document.getElementById('best').textContent = best;

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = (Math.random() - 0.5) * 3 - 1;
                this.life = 1;
                this.color = color;
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1;
                this.life -= 0.02;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function startGame() {
            initAudio();
            resizeCanvas();
            bird = {
                x: 80,
                y: canvas.height / 2,
                width: 34,
                height: 24,
                velocity: 0,
                rotation: 0
            };
            pipes = [];
            score = 0;
            gameRunning = true;
            gamePaused = false;
            frameCount = 0;
            particles = [];

            document.getElementById('startScreen').classList.add('hide');
            document.getElementById('gameOver').classList.remove('show');
            document.getElementById('pauseBtn').textContent = 'Pause';
            document.getElementById('tapHint').classList.add('show');
            setTimeout(() => document.getElementById('tapHint').classList.remove('show'), 3000);

            updateScore();
        }

        function flap() {
            if (!gameRunning || gamePaused) return;
            bird.velocity = FLAP_POWER;
            createParticles(bird.x, bird.y + bird.height, '#f39c12');
            playSound('flap'); // SOUND ADDED
            if (navigator.vibrate) navigator.vibrate(30);
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 5; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function spawnPipe() {
            const gapY = Math.random() * (canvas.height - PIPE_GAP - 100) + 50;
            pipes.push({
                x: canvas.width,
                gapY: gapY,
                passed: false
            });
        }

        function update() {
            if (!gameRunning || gamePaused) {
                requestAnimationFrame(update);
                return;
            }

            frameCount++;

            if (frameCount % 120 === 0) {
                spawnPipe();
            }

            bird.velocity += GRAVITY;
            bird.y += bird.velocity;
            bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.velocity * 0.05));

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= PIPE_SPEED;

                if (!pipes[i].passed && pipes[i].x + PIPE_WIDTH < bird.x) {
                    pipes[i].passed = true;
                    score++;
                    updateScore();
                    createParticles(bird.x, bird.y, '#f39c12');
                    playSound('score'); // SOUND ADDED
                }

                if (pipes[i].x + PIPE_WIDTH < 0) {
                    pipes.splice(i, 1);
                }

                if (bird.x + bird.width > pipes[i].x &&
                    bird.x < pipes[i].x + PIPE_WIDTH &&
                    (bird.y < pipes[i].gapY || bird.y + bird.height > pipes[i].gapY + PIPE_GAP)) {
                    endGame();
                }
            }

            if (bird.y + bird.height > canvas.height || bird.y < 0) {
                endGame();
            }

            particles = particles.filter(p => {
                p.update();
                return p.life > 0;
            });

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            ctx.fillStyle = '#71c25e';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 10);

            pipes.forEach(pipe => {
                ctx.fillStyle = '#73bf2e';
                ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.gapY);
                ctx.fillStyle = '#558022';
                ctx.fillRect(pipe.x - 5, pipe.gapY - 30, PIPE_WIDTH + 10, 30);

                ctx.fillStyle = '#73bf2e';
                ctx.fillRect(pipe.x, pipe.gapY + PIPE_GAP, PIPE_WIDTH, canvas.height - pipe.gapY - PIPE_GAP - 50);
                ctx.fillStyle = '#558022';
                ctx.fillRect(pipe.x - 5, pipe.gapY + PIPE_GAP, PIPE_WIDTH + 10, 30);

                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(pipe.x + 5, 0, 10, pipe.gapY);
                ctx.fillRect(pipe.x + 5, pipe.gapY + PIPE_GAP, 10, canvas.height);
            });

            particles.forEach(p => p.draw());

            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            ctx.rotate(bird.rotation);

            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.width / 2, bird.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            ctx.ellipse(-5, 2, 8, 5, -0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(8, -4, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(10, -4, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            ctx.moveTo(bird.width / 2, 0);
            ctx.lineTo(bird.width / 2 + 8, -3);
            ctx.lineTo(bird.width / 2 + 8, 3);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
            if (score > best) {
                best = score;
                localStorage.setItem('flappy-best-slow', best);
                document.getElementById('best').textContent = best;
            }
        }

        function endGame() {
            gameRunning = false;
            playSound('crash'); // SOUND ADDED
            document.getElementById('finalScore').textContent = score;
            const isNewBest = score > parseInt(localStorage.getItem('flappy-best-slow') || 0);
            document.getElementById('newBest').style.display = isNewBest && score > 0? 'block' : 'none';
            document.getElementById('gameOver').classList.add('show');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        function togglePause() {
            if (!gameRunning) return;
            gamePaused =!gamePaused;
            document.getElementById('pauseBtn').textContent = gamePaused? 'Resume' : 'Pause';
        }

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!gameRunning) startGame();
                else flap();
            }
            if (e.code === 'KeyP') togglePause();
        });

        canvas.addEventListener('click', () => {
            if (!gameRunning) startGame();
            else flap();
        });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) startGame();
            else flap();
        });

        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

        draw();
        update();
    </script>
</body>
</html>
