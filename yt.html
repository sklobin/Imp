<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube MP4 Downloader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}
.container{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,0.08);
  padding:22px;
  border-radius:18px;
  box-shadow:0 25px 45px rgba(0,0,0,.5);
}
h1{
  text-align:center;
  margin-bottom:18px;
  font-size:22px;
}
input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  outline:none;
  font-size:15px;
}
button{
  width:100%;
  margin-top:14px;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#ff9800;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{ background:#fb8c00; }

#status{
  margin-top:12px;
  font-size:14px;
  text-align:center;
}

.result{
  margin-top:18px;
  background:rgba(0,0,0,.35);
  border-radius:14px;
  overflow:hidden;
  display:none;
}
.thumb{
  width:100%;
  height:220px;
  object-fit:cover;
}
.info{
  padding:14px;
}
.title{
  font-size:15px;
  font-weight:bold;
  margin-bottom:6px;
}
.meta{
  font-size:13px;
  opacity:.8;
  margin-bottom:12px;
}
.download{
  display:block;
  text-align:center;
  padding:12px;
  border-radius:10px;
  background:#00e676;
  color:#000;
  font-weight:bold;
  text-decoration:none;
}
.download:hover{ background:#00c853; }
</style>
</head>

<body>

<div class="container">
  <h1>YouTube MP4 Downloader</h1>

  <input id="yturl" placeholder="Paste YouTube link">

  <button onclick="getVideo()">Get Video</button>

  <div id="status"></div>

  <div class="result" id="result">
    <img id="thumb" class="thumb">
    <div class="info">
      <div class="title" id="title"></div>
      <div class="meta" id="meta"></div>
      <a id="download" class="download" target="_blank">⬇ Download MP4</a>
    </div>
  </div>
</div>

<script>
const API_KEY = "darknero";
const API_ENDPOINT = "https://apis.sandarux.sbs/api/download/savetube";

function getVideo(){
  const url = document.getElementById("yturl").value.trim();
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if(!url){
    status.innerText = "❌ YouTube link daalo";
    return;
  }

  status.innerText = "⏳ Fetching video info...";
  result.style.display = "none";

  fetch(`${API_ENDPOINT}?apikey=${API_KEY}&url=${encodeURIComponent(url)}&format=mp4`)
    .then(res => res.json())
    .then(data => {
      if(!data.status){
        status.innerText = "❌ Video fetch nahi ho saka";
        return;
      }

      document.getElementById("thumb").src = data.thumbnail;
      document.getElementById("title").innerText = data.title;
      document.getElementById("meta").innerText =
        `Duration: ${data.duration}s • Format: ${data.format.toUpperCase()}`;

      document.getElementById("download").href = data.downloadUrl;

      result.style.display = "block";
      status.innerText = "✅ Ready to download";
    })
    .catch(() => {
      status.innerText = "❌ API error / limit issue";
    });
}
</script>

</body>
</html>
