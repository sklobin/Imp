<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>SK JAZZ FREE | PAK vs IND</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif}

body{
  background:linear-gradient(135deg,#000,#0b132b);
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.player-box{
  width:100%;
  max-width:900px;
  background:#050505;
  border-radius:18px;
  box-shadow:0 0 40px rgba(0,255,255,0.25);
  overflow:hidden;
  position:relative;
}

.header{
  padding:15px;
  text-align:center;
  background:linear-gradient(90deg,#0ff,#0047ab);
}

.header h1{
  font-size:26px;
  letter-spacing:2px;
}

.header p{
  font-size:14px;
  opacity:.9;
}

.match{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:#0c0c0c;
}

.team{
  font-size:20px;
  font-weight:600;
}

.vs{
  font-size:14px;
  opacity:.8;
}

video{
  width:100%;
  height:auto;
  background:#000;
}

/* Urdu Line */
.urdu-line{
  text-align:center;
  padding:12px;
  background:#0b0b0b;
  font-size:14px;
  color:#00ffff;
  letter-spacing:1px;
}

.footer{
  padding:10px;
  text-align:center;
  font-size:12px;
  background:#000;
  opacity:.7;
}

.live-dot{
  color:red;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:0}
}

/* WhatsApp Buttons */
.whatsapp-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:999;
}

.whatsapp-btn a{
  display:flex;
  align-items:center;
  gap:8px;
  background:#25D366;
  color:#fff;
  font-weight:600;
  padding:12px 16px;
  border-radius:50px;
  text-decoration:none;
  box-shadow:0 4px 10px rgba(0,0,0,0.3);
  transition:all 0.2s;
}

.whatsapp-btn a:hover{
  transform:translateY(-3px);
  box-shadow:0 6px 14px rgba(0,0,0,0.4);
}

.whatsapp-btn a svg{
  width:20px;
  height:20px;
  fill:#fff;
}
</style>
</head>

<body>

<div class="player-box">

  <!-- Header -->
  <div class="header">
    <h1>SK JAZZ FREE</h1>
    <p><span class="live-dot">●</span> LIVE STREAM</p>
  </div>

  <!-- Match Info -->
  <div class="match">
    <h2>ICC WORLD CUP 2026</h2>
  </div>

  <!-- Video Player -->
  <video id="video" controls autoplay playsinline></video>

  <!-- Urdu Line -->
  <div class="urdu-line">
    جیز کی سم پر مفت میچ دیکھیں
  </div>

  <!-- Footer -->
  <div class="footer">
    © 2026 SK JAZZ FREE • Sports Live Player
  </div>

</div>

<!-- WhatsApp Buttons -->
<div class="whatsapp-btn">
  <!-- Join Channel -->
  <a href="https://chat.whatsapp.com/YOUR_CHANNEL_LINK" target="_blank">
    <svg viewBox="0 0 448 512"><path d="M..."/></svg>
    Join Channel
  </a>

  <!-- Contact -->
  <a href="https://wa.me/YOUR_NUMBER?text=Hello%20SK%20Jazz" target="_blank">
    <svg viewBox="0 0 448 512"><path d="M..."/></svg>
    Contact Us
  </a>
</div>

<!-- HLS JS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const video = document.getElementById('video');
const streamURL = "https://cdn08khi.tamashaweb.com:8087/jazzauth/ICC-MEN-T20-abr/playlist.m3u8";

if (Hls.isSupported()) {
  const hls = new Hls({maxBufferLength:30, liveSyncDuration:10});
  hls.loadSource(streamURL);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, function(){ video.play(); });
}
else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = streamURL;
  video.addEventListener('loadedmetadata', function(){ video.play(); });
}
else { alert("Your browser does not support HLS playback."); }
</script>

</body>
</html>
